name: Kodio Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci || npm install
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Pick publish directory
        run: |
          if [ -d dist ]; then echo "dir=dist" >> "$GITHUB_ENV"; elif [ -d build ]; then echo "dir=build" >> "$GITHUB_ENV"; else echo "dir=." >> "$GITHUB_ENV"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
